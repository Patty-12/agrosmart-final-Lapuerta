# Puerto personalizado: NN = 92
server.port=8192

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/agrosmart_db
spring.datasource.username=postgres
spring.datasource.password=Patty.12

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita que Spring intente ejecutar scripts SQL
spring.sql.init.mode=never

# LangChain4j
langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.timeout=30s

# Logs de la petición y respuesta de IA
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
logging.level.dev.langchain4j=DEBUG