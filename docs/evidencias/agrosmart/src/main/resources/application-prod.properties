# Puerto personalizado: NN = 92
server.port=8192

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/agrosmart_db
spring.datasource.username=postgres
spring.datasource.password=TU_CLAVE_POSTGRES

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita que Spring intente ejecutar scripts SQL
spring.sql.init.mode=never